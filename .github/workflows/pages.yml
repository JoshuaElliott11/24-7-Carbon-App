name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p site/defaults
          cp frontend/public/index.html site/index.html
          cp frontend/public/app.js site/app.js
          cp frontend/public/local-sim.js site/local-sim.js
          cp defaults/grid_intensity_country.json site/defaults/grid_intensity_country.json
          cp defaults/technology_efs.json site/defaults/technology_efs.json
          cp defaults/demo_profiles.json site/defaults/demo_profiles.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
