name: Build and Release Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r backend/requirements.txt

      - name: Build launcher EXE
        run: .\build_exe.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 24-7-Carbon-Launcher
          path: dist/24-7-Carbon-Launcher.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/24-7-Carbon-Launcher.exe